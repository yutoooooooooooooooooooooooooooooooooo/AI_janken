<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dceeff">
    <title>じゃんけんゲーム</title>
    <style>
      :root {
        color-scheme: light;
        --bg-start: #071a2d;
        --bg-mid: #0d2f4f;
        --bg-end: #0b5c88;
        --panel: rgba(255, 255, 255, 0.18);
        --panel-solid: rgba(247, 252, 255, 0.92);
        --card: rgba(255, 255, 255, 0.72);
        --line: rgba(137, 188, 232, 0.7);
        --text: #123a5d;
        --muted: #5e7c96;
        --primary: #1c7ed6;
        --primary-strong: #114f92;
        --success: #1d9d6c;
        --warning: #a76d14;
        --danger: #c93d34;
        --shadow: rgba(7, 31, 51, 0.2);
        font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.25), transparent 18%),
          radial-gradient(circle at 80% 30%, rgba(123, 210, 255, 0.22), transparent 22%),
          linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 38%, var(--bg-end) 100%);
      }

      .game {
        position: relative;
        width: min(100%, 620px);
        padding: clamp(24px, 6vw, 52px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 32px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 28px 80px rgba(3, 19, 34, 0.35);
        text-align: center;
        overflow: hidden;
      }

      .game::before,
      .game::after {
        content: "";
        position: absolute;
        inset: auto;
        border-radius: 50%;
        filter: blur(18px);
        opacity: 0.65;
        pointer-events: none;
      }

      .game::before {
        width: 180px;
        height: 180px;
        right: -30px;
        top: -45px;
        background: rgba(115, 203, 255, 0.35);
      }

      .game::after {
        width: 120px;
        height: 120px;
        left: -28px;
        bottom: -26px;
        background: rgba(255, 196, 116, 0.25);
      }

      .eyebrow {
        position: relative;
        z-index: 1;
        margin: 0 0 10px;
        color: rgba(191, 228, 255, 0.92);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 3.5rem);
        letter-spacing: 0.08em;
        color: #ffffff;
        text-shadow: 0 10px 30px rgba(13, 71, 120, 0.3);
      }

      .intro {
        position: relative;
        z-index: 1;
        margin: 12px 0 28px;
        color: rgba(228, 242, 255, 0.9);
        font-weight: 600;
      }

      .scoreboard {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 14px;
      }

      .score {
        flex: 1;
        max-width: 180px;
        padding: 18px 14px 16px;
        border: 1px solid rgba(151, 199, 239, 0.75);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .score span {
        display: block;
        color: rgba(221, 238, 255, 0.85);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .score strong {
        display: block;
        margin-top: 8px;
        font-size: clamp(2rem, 6vw, 2.6rem);
        color: #ffffff;
        line-height: 1;
      }

      .reset {
        position: relative;
        z-index: 1;
        display: block;
        margin: 0 auto 22px;
        padding: 10px 18px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #eef8ff, #d8effd);
        color: var(--primary-strong);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(18, 103, 166, 0.18);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .reset:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(18, 103, 166, 0.2);
      }

      .result {
        position: relative;
        z-index: 1;
        min-height: 112px;
        margin-top: 16px;
        padding: 18px 16px 20px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(233, 246, 255, 0.95), rgba(205, 230, 251, 0.9));
        border: 1px solid rgba(120, 183, 245, 0.5);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .result h2 {
        margin: 0 0 8px;
        font-size: clamp(1.4rem, 4vw, 1.8rem);
        color: var(--primary-strong);
      }

      .result p {
        margin: 0;
        color: var(--muted);
        font-weight: 600;
      }

      .result[data-outcome="lose"] {
        background: linear-gradient(180deg, rgba(255, 240, 239, 0.97), rgba(255, 231, 230, 0.9));
        border-color: rgba(216, 117, 108, 0.5);
      }

      .result[data-outcome="lose"] h2 {
        color: var(--danger);
      }

      .result[data-outcome="draw"] {
        background: linear-gradient(180deg, rgba(255, 248, 223, 0.97), rgba(255, 237, 188, 0.9));
        border-color: rgba(209, 160, 69, 0.45);
      }

      .result[data-outcome="draw"] h2 {
        color: var(--warning);
      }

      .result[data-outcome="win"] {
        background: linear-gradient(180deg, rgba(234, 250, 240, 0.98), rgba(206, 240, 219, 0.9));
        border-color: rgba(75, 179, 121, 0.45);
      }

      .result[data-outcome="win"] h2 {
        color: var(--success);
      }

      .reveal {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
        padding: 18px 12px 10px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.1);
      }

      .reveal[hidden] {
        display: none;
      }

      .played {
        padding: 16px 12px 12px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(231, 242, 255, 0.96), rgba(209, 228, 248, 0.9));
        border: 1px solid rgba(125, 174, 219, 0.75);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .played.ai {
        background: linear-gradient(180deg, rgba(255, 247, 232, 0.96), rgba(252, 230, 191, 0.9));
        border-color: rgba(210, 159, 81, 0.7);
      }

      .played span {
        display: block;
        color: #5b82aa;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .played.ai span {
        color: #a16b1f;
      }

      .played .emoji {
        display: block;
        margin: 10px 0 8px;
        font-size: clamp(2.5rem, 8vw, 3.2rem);
        line-height: 1;
      }

      .played strong {
        display: block;
        font-size: 1.08rem;
        color: var(--text);
      }

      .versus {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .prompt {
        position: relative;
        z-index: 1;
        margin: 26px 0 16px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: rgba(231, 240, 255, 0.9);
      }

      .choices {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .choice {
        min-height: 120px;
        border: 1px solid rgba(153, 200, 243, 0.7);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(231, 239, 250, 0.9));
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.04em;
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
        box-shadow: 0 12px 24px rgba(15, 56, 86, 0.1);
      }

      .choice:hover {
        transform: translateY(-3px);
        border-color: rgba(71, 154, 221, 0.95);
        box-shadow: 0 18px 30px rgba(15, 56, 86, 0.12);
      }

      .choice:active {
        transform: translateY(0);
      }

      .choice:focus-visible,
      .reset:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }

      .emoji {
        display: block;
        margin-bottom: 7px;
        font-size: 2.7rem;
        line-height: 1;
      }

      @media (max-width: 420px) {
        .game {
          padding: 22px 16px 20px;
        }

        .scoreboard {
          gap: 10px;
        }

        .score {
          min-width: 0;
          flex: 1;
          padding: 14px 10px 12px;
        }

        .choice {
          min-height: 96px;
          border-radius: 16px;
          font-size: 0.9rem;
        }

        .reveal {
          gap: 10px;
          padding: 14px 8px 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <p class="eyebrow">ROCK · PAPER · SCISSORS</p>
      <h1>じゃんけん</h1>
      <p class="intro">手を選んで、AIと勝負しよう！</p>

      <section class="scoreboard" aria-label="スコア">
        <div class="score">
          <span>あなた</span>
          <strong id="player-score">0</strong>
        </div>
        <div class="score">
          <span>AI</span>
          <strong id="computer-score">0</strong>
        </div>
      </section>
      <button class="reset" id="reset" type="button">スコアをリセット</button>

      <section class="result" id="result" aria-live="polite" aria-atomic="true">
        <h2 id="result-title">さあ、勝負！</h2>
        <p id="result-detail">グー・パー・チョキから選んでね。</p>
      </section>

      <section class="reveal" id="reveal" hidden aria-label="出した手">
        <div class="played">
          <span>あなた</span>
          <span class="emoji" id="player-hand-emoji" aria-hidden="true">✊</span>
          <strong id="player-hand-name">グー</strong>
        </div>
        <p class="versus">VS</p>
        <div class="played ai">
          <span>AIの手</span>
          <span class="emoji" id="ai-hand-emoji" aria-hidden="true">✋</span>
          <strong id="ai-hand-name">パー</strong>
        </div>
      </section>

      <p class="prompt">どの手を出す？</p>
      <div class="choices" aria-label="手を選ぶ">
        <button class="choice" type="button" data-choice="rock" aria-label="グー">
          <span class="emoji" aria-hidden="true">✊</span>グー
        </button>
        <button class="choice" type="button" data-choice="scissors" aria-label="チョキ">
          <span class="emoji" aria-hidden="true">✌️</span>チョキ
        </button>
        <button class="choice" type="button" data-choice="paper" aria-label="パー">
          <span class="emoji" aria-hidden="true">✋</span>パー
        </button>
      </div>
    </main>

    <script>
      const hands = {
        rock: { name: "グー", emoji: "✊" },
        paper: { name: "パー", emoji: "✋" },
        scissors: { name: "チョキ", emoji: "✌️" }
      };
      const choices = Object.keys(hands);
      const winningPairs = {
        rock: "scissors",
        paper: "rock",
        scissors: "paper"
      };

      let playerScore = 0;
      let computerScore = 0;

      const playerScoreElement = document.querySelector("#player-score");
      const computerScoreElement = document.querySelector("#computer-score");
      const resultElement = document.querySelector("#result");
      const resultTitle = document.querySelector("#result-title");
      const resultDetail = document.querySelector("#result-detail");
      const revealElement = document.querySelector("#reveal");
      const playerHandEmoji = document.querySelector("#player-hand-emoji");
      const playerHandName = document.querySelector("#player-hand-name");
      const aiHandEmoji = document.querySelector("#ai-hand-emoji");
      const aiHandName = document.querySelector("#ai-hand-name");

      function play(playerChoice) {
        const computerChoice = choices[Math.floor(Math.random() * choices.length)];
        let outcome;

        if (playerChoice === computerChoice) {
          outcome = "draw";
        } else if (winningPairs[playerChoice] === computerChoice) {
          outcome = "win";
          playerScore += 1;
        } else {
          outcome = "lose";
          computerScore += 1;
        }

        const playerHand = hands[playerChoice];
        const aiHand = hands[computerChoice];

        playerScoreElement.textContent = playerScore;
        computerScoreElement.textContent = computerScore;
        playerHandEmoji.textContent = playerHand.emoji;
        playerHandName.textContent = playerHand.name;
        aiHandEmoji.textContent = aiHand.emoji;
        aiHandName.textContent = aiHand.name;
        revealElement.hidden = false;
        resultElement.dataset.outcome = outcome;
        resultTitle.textContent = outcome === "draw" ? "あいこ！" : outcome === "win" ? "あなたの勝ち！" : "あなたの負け…";
        resultDetail.textContent = "もう一度手を選んでね。";
      }

      document.querySelectorAll(".choice").forEach((button) => {
        button.addEventListener("click", () => play(button.dataset.choice));
      });

      document.querySelector("#reset").addEventListener("click", () => {
        playerScore = 0;
        computerScore = 0;
        playerScoreElement.textContent = playerScore;
        computerScoreElement.textContent = computerScore;
        revealElement.hidden = true;
        resultElement.dataset.outcome = "";
        resultTitle.textContent = "さあ、勝負！";
        resultDetail.textContent = "グー・パー・チョキから選んでね。";
      });
    </script>
  </body>
</html>
