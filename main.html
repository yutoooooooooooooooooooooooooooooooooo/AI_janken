<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dceeff">
    <title>じゃんけんゲーム</title>
    <style>
      :root {
        color-scheme: light;
        --bg-start: #071a2d;
        --bg-mid: #0d2f4f;
        --bg-end: #0b5c88;
        --panel: rgba(255, 255, 255, 0.18);
        --panel-solid: rgba(247, 252, 255, 0.92);
        --card: rgba(255, 255, 255, 0.72);
        --line: rgba(137, 188, 232, 0.7);
        --text: #123a5d;
        --muted: #5e7c96;
        --primary: #1c7ed6;
        --primary-strong: #114f92;
        --success: #1d9d6c;
        --warning: #a76d14;
        --danger: #c93d34;
        --shadow: rgba(7, 31, 51, 0.2);
        font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.25), transparent 18%),
          radial-gradient(circle at 80% 30%, rgba(123, 210, 255, 0.22), transparent 22%),
          linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 38%, var(--bg-end) 100%);
      }

      .game,
      .game-menu {
        position: relative;
        width: min(100%, 620px);
        padding: clamp(24px, 6vw, 52px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 32px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 28px 80px rgba(3, 19, 34, 0.35);
        text-align: center;
        overflow: hidden;
      }

      .game::before,
      .game::after,
      .game-menu::before,
      .game-menu::after {
        content: "";
        position: absolute;
        inset: auto;
        border-radius: 50%;
        filter: blur(18px);
        opacity: 0.65;
        pointer-events: none;
      }

      .game::before {
        width: 180px;
        height: 180px;
        right: -30px;
        top: -45px;
        background: rgba(115, 203, 255, 0.35);
      }

      .game::after {
        width: 120px;
        height: 120px;
        left: -28px;
        bottom: -26px;
        background: rgba(255, 196, 116, 0.25);
      }

      .game-menu::before {
        width: 180px;
        height: 180px;
        right: -30px;
        top: -45px;
        background: rgba(115, 203, 255, 0.35);
      }

      .game-menu::after {
        width: 120px;
        height: 120px;
        left: -28px;
        bottom: -26px;
        background: rgba(255, 196, 116, 0.25);
      }

      .game-option {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        width: 100%;
        gap: 18px;
        margin-top: 30px;
        padding: 20px;
        border: 1px solid rgba(153, 200, 243, 0.7);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(231, 239, 250, 0.9));
        color: var(--text);
        cursor: pointer;
        font: inherit;
        text-align: left;
        box-shadow: 0 12px 24px rgba(15, 56, 86, 0.1);
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      }

      .game-option:hover {
        transform: translateY(-3px);
        border-color: rgba(71, 154, 221, 0.95);
        box-shadow: 0 18px 30px rgba(15, 56, 86, 0.16);
      }

      .game-option:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }

      .game-option-icon {
        flex: 0 0 auto;
        font-size: 2rem;
      }

      .game-option-copy {
        flex: 1;
      }

      .game-option-copy strong,
      .game-option-copy small {
        display: block;
      }

      .game-option-copy strong {
        font-size: 1.25rem;
      }

      .game-option-copy small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .game-option-arrow {
        color: var(--primary);
        font-size: 2rem;
        font-weight: 700;
      }

      .eyebrow {
        position: relative;
        z-index: 1;
        margin: 0 0 10px;
        color: rgba(191, 228, 255, 0.92);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 3.5rem);
        letter-spacing: 0.08em;
        color: #ffffff;
        text-shadow: 0 10px 30px rgba(13, 71, 120, 0.3);
      }

      .intro {
        position: relative;
        z-index: 1;
        margin: 12px 0 28px;
        color: rgba(228, 242, 255, 0.9);
        font-weight: 600;
      }

      .scoreboard {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 14px;
      }

      .score {
        flex: 1;
        max-width: 180px;
        padding: 18px 14px 16px;
        border: 1px solid rgba(151, 199, 239, 0.75);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .score span {
        display: block;
        color: rgba(221, 238, 255, 0.85);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .score strong {
        display: block;
        margin-top: 8px;
        font-size: clamp(2rem, 6vw, 2.6rem);
        color: #ffffff;
        line-height: 1;
      }

      .reset {
        position: relative;
        z-index: 1;
        display: block;
        margin: 0 auto 22px;
        padding: 10px 18px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #eef8ff, #d8effd);
        color: var(--primary-strong);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(18, 103, 166, 0.18);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .reset:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(18, 103, 166, 0.2);
      }

      .result {
        position: relative;
        z-index: 1;
        min-height: 112px;
        margin-top: 16px;
        padding: 18px 16px 20px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(233, 246, 255, 0.95), rgba(205, 230, 251, 0.9));
        border: 1px solid rgba(120, 183, 245, 0.5);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .result h2 {
        margin: 0 0 8px;
        font-size: clamp(1.4rem, 4vw, 1.8rem);
        color: var(--primary-strong);
      }

      .result p {
        margin: 0;
        color: var(--muted);
        font-weight: 600;
      }

      .result[data-outcome="lose"] {
        background: linear-gradient(180deg, rgba(255, 240, 239, 0.97), rgba(255, 231, 230, 0.9));
        border-color: rgba(216, 117, 108, 0.5);
      }

      .result[data-outcome="lose"] h2 {
        color: var(--danger);
      }

      .result[data-outcome="draw"] {
        background: linear-gradient(180deg, rgba(255, 248, 223, 0.97), rgba(255, 237, 188, 0.9));
        border-color: rgba(209, 160, 69, 0.45);
      }

      .result[data-outcome="draw"] h2 {
        color: var(--warning);
      }

      .result[data-outcome="win"] {
        background: linear-gradient(180deg, rgba(234, 250, 240, 0.98), rgba(206, 240, 219, 0.9));
        border-color: rgba(75, 179, 121, 0.45);
      }

      .result[data-outcome="win"] h2 {
        color: var(--success);
      }

      .reveal {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
        padding: 18px 12px 10px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.1);
      }

      .reveal[hidden] {
        display: none;
      }

      .played {
        padding: 16px 12px 12px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(231, 242, 255, 0.96), rgba(209, 228, 248, 0.9));
        border: 1px solid rgba(125, 174, 219, 0.75);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .played.ai {
        background: linear-gradient(180deg, rgba(255, 247, 232, 0.96), rgba(252, 230, 191, 0.9));
        border-color: rgba(210, 159, 81, 0.7);
      }

      .reveal[data-phase="counting"] .played {
        animation: fist-pump 600ms ease-in-out infinite;
      }

      .reveal[data-phase="throw"] .played {
        animation: hands-meet 350ms ease-out both;
      }

      .reveal[data-phase="throw"] .played .emoji {
        animation: hand-reveal 350ms ease-out both;
      }

      .reveal[data-phase="throw"] .played.ai {
        animation-name: hands-meet-ai;
      }

      @keyframes fist-pump {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes hands-meet {
        from { transform: translateX(0) scale(1); }
        to { transform: translateX(8px) scale(1.05); }
      }

      @keyframes hands-meet-ai {
        from { transform: translateX(0) scale(1); }
        to { transform: translateX(-8px) scale(1.05); }
      }

      @keyframes hand-reveal {
        from { transform: scale(0.75) rotate(-12deg); }
        to { transform: scale(1.15) rotate(0); }
      }

      .played span {
        display: block;
        color: #5b82aa;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .played.ai span {
        color: #a16b1f;
      }

      .played .emoji {
        display: block;
        margin: 10px 0 8px;
        font-size: clamp(2.5rem, 8vw, 3.2rem);
        line-height: 1;
      }

      .played strong {
        display: block;
        font-size: 1.08rem;
        color: var(--text);
      }

      .versus {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .prompt {
        position: relative;
        z-index: 1;
        margin: 26px 0 16px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: rgba(231, 240, 255, 0.9);
      }

      .choices {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .choice {
        min-height: 120px;
        border: 1px solid rgba(153, 200, 243, 0.7);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(231, 239, 250, 0.9));
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.04em;
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
        box-shadow: 0 12px 24px rgba(15, 56, 86, 0.1);
      }

      .choice:hover {
        transform: translateY(-3px);
        border-color: rgba(71, 154, 221, 0.95);
        box-shadow: 0 18px 30px rgba(15, 56, 86, 0.12);
      }

      .choice:active {
        transform: translateY(0);
      }

      .choice:disabled {
        cursor: wait;
      }

      .choice:focus-visible,
      .reset:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }

      .emoji {
        display: block;
        margin-bottom: 7px;
        font-size: 2.7rem;
        line-height: 1;
      }

      .baseball-topbar {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .baseball-topbar .reset {
        margin: 0;
        padding: 9px 14px;
        font-size: 0.9rem;
      }

      .baseball-scoreboard {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 20px 0;
      }

      .baseball-score {
        min-width: 100px;
        padding: 12px 20px;
        border: 1px solid rgba(151, 199, 239, 0.75);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }

      .baseball-score span,
      .baseball-score strong {
        display: block;
      }

      .baseball-score span {
        font-size: 0.8rem;
      }

      .baseball-score strong {
        margin-top: 4px;
        font-size: 1.8rem;
        line-height: 1;
      }

      .baseball-scene {
        position: relative;
        z-index: 1;
        height: clamp(380px, 46vw, 690px);
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.72);
        border-radius: 26px;
        background:
          linear-gradient(180deg, #90bfd0 0%, #426378 43%, #193c3f 100%);
        box-shadow: inset 0 0 48px rgba(4, 17, 26, 0.45), 0 16px 34px rgba(7, 31, 51, 0.3);
        perspective: 900px;
      }

      .baseball-art {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: perspective(1200px) rotateX(4deg) scale(1.015);
        transform-origin: center bottom;
      }

      .baseball-game {
        width: min(100%, 1480px);
        padding: clamp(20px, 3vw, 46px);
      }

      .pitcher-figure,
      .batter-figure,
      .batter-bat {
        transform-box: fill-box;
      }

      .pitcher-figure {
        transform-origin: 50% 88%;
        filter: drop-shadow(0 4px 3px rgba(7, 20, 23, 0.35));
      }

      .batter-figure {
        transform-origin: 50% 90%;
        filter: drop-shadow(0 4px 3px rgba(7, 20, 23, 0.35));
      }

      .batter-bat {
        transform-origin: 18% 72%;
        filter: drop-shadow(1px 2px 1px rgba(7, 20, 23, 0.45));
      }

      .baseball-scene.pitching .pitcher-figure {
        animation: pitcher-throw 700ms ease-in-out both;
      }

      .baseball-scene.swinging .batter-figure {
        animation: batter-body-swing 520ms ease-in-out;
      }

      .baseball-scene.swinging .batter-bat {
        animation: batter-swing 520ms ease-in-out;
      }

      .swing-zone {
        position: absolute;
        z-index: 2;
        top: 82%;
        left: 50%;
        display: grid;
        width: 92px;
        height: 42px;
        place-items: center;
        border: 2px dashed rgba(255, 255, 255, 0.82);
        border-radius: 50%;
        color: #fff;
        opacity: 0.72;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        transform: translate(-50%, -50%);
        transition: opacity 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        pointer-events: none;
      }

      .swing-zone span {
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(15, 58, 38, 0.75);
        font-size: 0.58rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .baseball-scene.timing-window .swing-zone {
        border-color: #ffe66d;
        box-shadow: 0 0 18px 5px rgba(255, 230, 109, 0.8);
        opacity: 1;
        animation: timing-pulse 500ms ease-in-out infinite alternate;
      }

      .pitch-ball {
        position: absolute;
        z-index: 4;
        top: 62%;
        left: 50%;
        width: 25px;
        height: 25px;
        border: 2px solid #d8443d;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 3px 8px rgba(16, 49, 31, 0.35);
        opacity: 0;
        transform: translate(-50%, -50%);
      }

      .pitch-ball::before,
      .pitch-ball::after {
        content: "";
        position: absolute;
        top: 3px;
        width: 5px;
        height: 15px;
        border: 1px solid #d8443d;
        border-top-color: transparent;
        border-bottom-color: transparent;
        border-radius: 50%;
      }

      .pitch-ball::before {
        left: 4px;
      }

      .pitch-ball::after {
        right: 4px;
      }

      .baseball-scene.pitching .pitch-ball {
        animation: ball-flight 2700ms cubic-bezier(0.35, 0.05, 0.65, 1) forwards;
      }

      .baseball-scene.hitting .pitch-ball {
        animation: batted-ball-flight 1150ms cubic-bezier(0.2, 0.65, 0.35, 1) forwards;
      }

      .baseball-scene.hitting.home-run .pitch-ball {
        animation-duration: 1600ms;
      }

      .baseball-scene.hitting.foul .pitch-ball {
        animation-duration: 900ms;
      }

      @keyframes pitcher-throw {
        0%, 100% { transform: rotate(0) translateY(0); }
        22% { transform: rotate(-17deg) translateY(-5px); }
        48% { transform: rotate(23deg) translateY(-3px) scale(1.04); }
        72% { transform: rotate(-7deg) translateY(2px); }
      }

      @keyframes batter-swing {
        0% { transform: rotate(0); }
        40% { transform: rotate(-72deg) scale(1.08); }
        75% { transform: rotate(12deg) scale(1.02); }
        100% { transform: rotate(18deg); }
      }

      @keyframes batter-body-swing {
        0%, 100% { transform: rotate(0); }
        40% { transform: rotate(-9deg) translateY(-3px); }
        75% { transform: rotate(5deg) translateY(1px); }
      }

      @keyframes ball-flight {
        0% { top: 62%; left: 50%; opacity: 1; transform: translate(-50%, -50%) scale(0.38); }
        45% { top: 75%; left: var(--pitch-mid-x, 50%); opacity: 1; transform: translate(-50%, -50%) scale(0.78); }
        100% { top: 88%; left: var(--pitch-end-x, 50%); opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
      }

      @keyframes batted-ball-flight {
        0% { top: 88%; left: 50%; opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
        30% { top: var(--flight-mid-y, 48%); left: var(--flight-mid-x, 55%); opacity: 1; transform: translate(-50%, -50%) scale(0.95); }
        100% { top: var(--flight-end-y, 18%); left: var(--flight-end-x, 70%); opacity: 0.15; transform: translate(-50%, -50%) scale(0.25); }
      }

      @keyframes timing-pulse {
        from { transform: translate(-50%, -50%) scale(1); }
        to { transform: translate(-50%, -50%) scale(1.12); }
      }

      @keyframes button-pulse {
        from { transform: scale(1); }
        to { transform: scale(1.02); }
      }

      .baseball-result {
        position: relative;
        z-index: 1;
        min-height: 84px;
        margin: 16px 0;
        padding: 16px;
        border: 1px solid rgba(120, 183, 245, 0.5);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(233, 246, 255, 0.95), rgba(205, 230, 251, 0.9));
        color: var(--primary-strong);
        font-size: 1.25rem;
        font-weight: 800;
      }

      .swing-button {
        position: relative;
        z-index: 1;
        width: 100%;
        min-height: 64px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 20px;
        background: linear-gradient(180deg, #ffe082, #ffb52e);
        color: #583300;
        cursor: pointer;
        font: inherit;
        font-size: 1.2rem;
        font-weight: 900;
        box-shadow: 0 10px 24px rgba(77, 51, 5, 0.2);
      }

      .swing-button:hover:not(:disabled) {
        filter: brightness(1.05);
        transform: translateY(-2px);
      }

      .swing-button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .swing-button.timing-ready {
        border-color: #fff6bf;
        background: linear-gradient(180deg, #fff176, #ff9f1c);
        box-shadow: 0 0 0 5px rgba(255, 229, 109, 0.3), 0 12px 28px rgba(77, 51, 5, 0.28);
        animation: button-pulse 500ms ease-in-out infinite alternate;
      }

      .swing-button:focus-visible,
      .baseball-topbar .reset:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }

      @media (max-width: 420px) {
        .game {
          padding: 22px 16px 20px;
        }

        .scoreboard {
          gap: 10px;
        }

        .score {
          min-width: 0;
          flex: 1;
          padding: 14px 10px 12px;
        }

        .choice {
          min-height: 96px;
          border-radius: 16px;
          font-size: 0.9rem;
        }

        .reveal {
          gap: 10px;
          padding: 14px 8px 8px;
        }

        .baseball-scene {
          height: 300px;
        }

        .baseball-score {
          min-width: 0;
          flex: 1;
        }
      }

      @media (max-width: 700px) {
        .baseball-game {
          width: 100%;
          padding: 20px 14px;
        }

        .baseball-game .baseball-scene {
          height: clamp(260px, 72vw, 440px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="game-menu" id="game-menu">
      <p class="eyebrow">CHOOSE A GAME</p>
      <h1>ゲームを選ぼう</h1>
      <p class="intro">遊びたいゲームを選択してください。</p>
      <button class="game-option" id="start-janken" type="button">
        <span class="game-option-icon" aria-hidden="true">✊✌️✋</span>
        <span class="game-option-copy">
          <strong>じゃんけん</strong>
          <small>AIとじゃんけん勝負！</small>
        </span>
        <span class="game-option-arrow" aria-hidden="true">›</span>
      </button>
      <button class="game-option" id="start-baseball" type="button">
        <span class="game-option-icon" aria-hidden="true">⚾</span>
        <span class="game-option-copy">
          <strong>野球ゲーム</strong>
          <small>タイミングを合わせてホームラン！</small>
        </span>

    <script>
      const hands = {
        rock: { name: "グー", emoji: "✊" },
        paper: { name: "パー", emoji: "✋" },
        scissors: { name: "チョキ", emoji: "✌️" }
      };
      const choices = Object.keys(hands);
      const winningPairs = {
        rock: "scissors",
        paper: "rock",
        scissors: "paper"
      };

      let playerScore = 0;
      let computerScore = 0;
      let roundTimer = null;

      const playerScoreElement = document.querySelector("#player-score");
      const computerScoreElement = document.querySelector("#computer-score");
      const resultElement = document.querySelector("#result");
      const resultTitle = document.querySelector("#result-title");
      const resultDetail = document.querySelector("#result-detail");
      const revealElement = document.querySelector("#reveal");
      const playerHandEmoji = document.querySelector("#player-hand-emoji");
      const playerHandName = document.querySelector("#player-hand-name");
      const aiHandEmoji = document.querySelector("#ai-hand-emoji");
      const aiHandName = document.querySelector("#ai-hand-name");
      const choiceButtons = document.querySelectorAll(".choice");
      const gameMenu = document.querySelector("#game-menu");
      const gameScreen = document.querySelector("#game-screen");
      const baseballScreen = document.querySelector("#baseball-screen");
      const baseballScene = document.querySelector("#baseball-scene");
      const baseballHitsElement = document.querySelector("#baseball-hits");
      const baseballOutsElement = document.querySelector("#baseball-outs");
      const baseballFoulsElement = document.querySelector("#baseball-fouls");
      const stadiumScoreElement = document.querySelector("#stadium-score");
      const baseballResultElement = document.querySelector("#baseball-result");
      const swingButton = document.querySelector("#swing-button");
      const pitchBall = document.querySelector("#pitch-ball");
      let baseballHits = 0;
      let baseballOuts = 0;
      let baseballFouls = 0;
      let baseballActive = false;
      let pitchStartedAt = null;
      let nextPitchTimer = null;
      let pitchTimeout = null;
      let timingCueTimer = null;
      let swingAnimationTimer = null;

      document.querySelector("#start-janken").addEventListener("click", () => {
        gameMenu.hidden = true;
        gameScreen.hidden = false;
        choiceButtons[0].focus();
      });

      function stopBaseballTimers() {
        window.clearTimeout(nextPitchTimer);
        window.clearTimeout(pitchTimeout);
        window.clearTimeout(timingCueTimer);
        window.clearTimeout(swingAnimationTimer);
        nextPitchTimer = null;
        pitchTimeout = null;
        timingCueTimer = null;
        swingAnimationTimer = null;
        pitchStartedAt = null;
        baseballScene.classList.remove("pitching");
        baseballScene.classList.remove("timing-window");
        baseballScene.classList.remove("hitting");
        baseballScene.classList.remove("home-run");
        baseballScene.classList.remove("foul");
        baseballScene.classList.remove("swinging");
        swingButton.classList.remove("timing-ready");
        swingButton.disabled = true;
      }

      function updateBaseballScore() {
        baseballHitsElement.textContent = baseballHits;
        baseballOutsElement.textContent = `${baseballOuts} / 3`;
        baseballFoulsElement.textContent = baseballFouls;
        stadiumScoreElement.textContent = `HITS ${baseballHits} · OUTS ${baseballOuts} · FOULS ${baseballFouls}`;
      }

      function schedulePitch(delay) {
        if (!baseballActive) {
          return;
        }

        nextPitchTimer = window.setTimeout(() => {
          pitchStartedAt = performance.now();
          baseballScene.classList.remove("hitting");
          baseballScene.classList.remove("home-run");
          baseballScene.classList.remove("foul");
          const pitchDrift = Math.random() * 8 - 4;
          pitchBall.style.setProperty("--pitch-mid-x", `${50 + pitchDrift}%`);
          pitchBall.style.setProperty("--pitch-end-x", `${50 - pitchDrift * 0.35}%`);
          baseballScene.classList.add("pitching");
          swingButton.disabled = true;
          swingButton.textContent = "ボールを待とう…";
          baseballResultElement.textContent = "ピッチャーが投げた！ボールをよく見て…";
          timingCueTimer = window.setTimeout(() => {
            if (!baseballActive || pitchStartedAt === null) {
              return;
            }

            baseballScene.classList.add("timing-window");
            swingButton.classList.add("timing-ready");
            swingButton.disabled = false;
            swingButton.textContent = "今だ！スイング！";
            baseballResultElement.textContent = "ボールが来た！タイミングを合わせてスイング！";
          }, 1800);
          pitchTimeout = window.setTimeout(() => resolvePitch("miss"), 2700);
        }, delay);
      }

      function resolvePitch(result) {
        if (!baseballActive || pitchStartedAt === null) {
          return;
        }

        window.clearTimeout(pitchTimeout);
        window.clearTimeout(timingCueTimer);
        pitchTimeout = null;
        timingCueTimer = null;
        pitchStartedAt = null;
        baseballScene.classList.remove("pitching");
        baseballScene.classList.remove("timing-window");
        swingButton.classList.remove("timing-ready");
        swingButton.disabled = true;

        if (result === "home-run") {
          baseballHits += 3;
          baseballScene.classList.add("hitting");
          baseballScene.classList.add("home-run");
          baseballResultElement.textContent = "ホームラン！ジャストミート！ +3";
        } else if (result === "hit") {
          baseballHits += 1;
          baseballScene.classList.add("hitting");
          baseballResultElement.textContent = "フェア！いい当たり！ +1";
        } else if (result === "foul") {
          baseballFouls += 1;
          baseballScene.classList.add("hitting");
          baseballScene.classList.add("foul");
          baseballResultElement.textContent = "ファウル！打球がラインの外へ…";
        } else {
          baseballOuts += 1;
          baseballResultElement.textContent = result === "miss" ? "見逃し！アウト…" : "空振り…アウト！";
        }

        updateBaseballScore();
        if (baseballOuts >= 3) {
          baseballActive = false;
          baseballResultElement.textContent = `ゲーム終了！ヒット ${baseballHits} 点`;
          swingButton.textContent = "リスタートしてもう一度！";
          swingButton.disabled = false;
          return;
        }

        schedulePitch(1400);
      }

      function startBaseball() {
        stopBaseballTimers();
        baseballHits = 0;
        baseballOuts = 0;
        baseballFouls = 0;
        baseballActive = true;
        swingButton.textContent = "ボールを待とう…";
        baseballResultElement.textContent = "ピッチャーが投球準備中…";
        updateBaseballScore();
        gameMenu.hidden = true;
        baseballScreen.hidden = false;
        schedulePitch(700);
        swingButton.focus();
      }

      document.querySelector("#start-baseball").addEventListener("click", startBaseball);
      document.querySelector("#reset-baseball").addEventListener("click", startBaseball);
      swingButton.addEventListener("click", () => {
        if (!baseballActive) {
          startBaseball();
          return;
        }

        if (pitchStartedAt === null || swingButton.disabled) {
          return;
        }

        baseballScene.classList.remove("swinging");
        void baseballScene.offsetWidth;
        baseballScene.classList.add("swinging");
        window.clearTimeout(swingAnimationTimer);
        swingAnimationTimer = window.setTimeout(() => {
          baseballScene.classList.remove("swinging");
          swingAnimationTimer = null;
        }, 450);

        const timingError = performance.now() - pitchStartedAt - 2250;
        const timing = Math.abs(timingError);
        if (timing <= 90) {
          const sprayAngle = Math.random() * 50 - 25;
          setBattedBallTrajectory(sprayAngle, 42, true);
          resolvePitch("home-run");
        } else if (timing <= 430) {
          const sprayAngle = timingError * 0.045 + Math.random() * 56 - 28;
          const launchAngle = Math.max(8, Math.min(50, 28 + timingError * 0.025 + Math.random() * 16 - 8));
          setBattedBallTrajectory(sprayAngle, launchAngle, false);
          resolvePitch(Math.abs(sprayAngle) > 45 ? "foul" : "hit");
        } else {
          resolvePitch("out");
        }
      });

      function setBattedBallTrajectory(sprayAngle, launchAngle, homeRun) {
        const endX = Math.max(5, Math.min(95, 50 + sprayAngle * 0.7));
        const midX = 50 + sprayAngle * 0.25;
        const midY = Math.max(34, 69 - launchAngle * 0.55);
        const endY = homeRun ? 3 : Math.max(10, Math.min(68, 76 - launchAngle * 1.25));
        pitchBall.style.setProperty("--flight-mid-x", `${midX}%`);
        pitchBall.style.setProperty("--flight-mid-y", `${midY}%`);
        pitchBall.style.setProperty("--flight-end-x", `${endX}%`);
        pitchBall.style.setProperty("--flight-end-y", `${endY}%`);
      }

      document.querySelector("#back-to-menu").addEventListener("click", () => {
        baseballActive = false;
        stopBaseballTimers();
        baseballScreen.hidden = true;
        gameMenu.hidden = false;
        document.querySelector("#start-baseball").focus();
      });

      function play(playerChoice) {
        const computerChoice = choices[Math.floor(Math.random() * choices.length)];
        choiceButtons.forEach((button) => {
          button.disabled = true;
        });

        revealElement.hidden = false;
        revealElement.dataset.phase = "counting";
        playerHandEmoji.textContent = hands.rock.emoji;
        playerHandName.textContent = hands.rock.name;
        aiHandEmoji.textContent = hands.rock.emoji;
        aiHandName.textContent = hands.rock.name;
        resultElement.dataset.outcome = "";
        resultTitle.textContent = "初はグー！";
        resultDetail.textContent = "AIといっしょに手を振って…";

        roundTimer = window.setTimeout(() => {
          resultTitle.textContent = "じゃんけん…";
          roundTimer = window.setTimeout(() => {
            revealElement.dataset.phase = "throw";
            resultTitle.textContent = "ぽん！";
            roundTimer = window.setTimeout(() => {
              const outcome = playerChoice === computerChoice
                ? "draw"
                : winningPairs[playerChoice] === computerChoice
                  ? "win"
                  : "lose";

              if (outcome === "win") {
                playerScore += 1;
              } else if (outcome === "lose") {
                computerScore += 1;
              }

              const playerHand = hands[playerChoice];
              const aiHand = hands[computerChoice];

              playerScoreElement.textContent = playerScore;
              computerScoreElement.textContent = computerScore;
              playerHandEmoji.textContent = playerHand.emoji;
              playerHandName.textContent = playerHand.name;
              aiHandEmoji.textContent = aiHand.emoji;
              aiHandName.textContent = aiHand.name;
              revealElement.dataset.phase = "result";
              resultElement.dataset.outcome = outcome;
              resultTitle.textContent = outcome === "draw" ? "あいこ！" : outcome === "win" ? "あなたの勝ち！" : "あなたの負け…";
              resultDetail.textContent = "もう一度手を選んでね。";
              choiceButtons.forEach((button) => {
                button.disabled = false;
              });
              roundTimer = null;
            }, 350);
          }, 600);
        }, 600);
      }

      choiceButtons.forEach((button) => {
        button.addEventListener("click", () => play(button.dataset.choice));
      });

      document.querySelector("#reset").addEventListener("click", () => {
        window.clearTimeout(roundTimer);
        roundTimer = null;
        playerScore = 0;
        computerScore = 0;
        playerScoreElement.textContent = playerScore;
        computerScoreElement.textContent = computerScore;
        revealElement.hidden = true;
        delete revealElement.dataset.phase;
        resultElement.dataset.outcome = "";
        resultTitle.textContent = "さあ、勝負！";
        resultDetail.textContent = "グー・パー・チョキから選んでね。";
        choiceButtons.forEach((button) => {
          button.disabled = false;
        });
      });
    </script>
  </body>
</html>
