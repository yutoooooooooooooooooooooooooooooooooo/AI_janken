<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dceeff">
    <title>じゃんけんゲーム</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        color: #173c63;
        background: #dceeff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: #dceeff;
        background-image:
          radial-gradient(circle at 20% 25%, rgb(255 255 255 / 75%) 0 2px, transparent 3px),
          radial-gradient(circle at 75% 70%, rgb(76 148 210 / 16%) 0 3px, transparent 4px),
          repeating-linear-gradient(135deg, transparent 0 28px, rgb(70 143 204 / 7%) 28px 30px);
        background-size: 34px 34px, 48px 48px, auto;
      }

      .game {
        width: min(100%, 560px);
        padding: clamp(24px, 6vw, 48px);
        border: 1px solid #b8d7f0;
        border-radius: 28px;
        background: rgb(247 252 255 / 92%);
        box-shadow: 0 24px 70px rgb(34 91 142 / 16%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #5682a8;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        letter-spacing: 0.04em;
      }

      .intro {
        margin: 12px 0 28px;
        color: #587894;
      }

      .scoreboard {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .score {
        min-width: 120px;
        padding: 14px 20px;
        border-radius: 16px;
        background: #e6f2fc;
      }

      .score span {
        display: block;
        color: #5682a8;
        font-size: 0.82rem;
      }

      .score strong {
        display: block;
        margin-top: 2px;
        font-size: 1.8rem;
      }

      .prompt {
        margin: 0 0 14px;
        font-weight: 700;
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .choice {
        min-height: 112px;
        border: 2px solid #c1dced;
        border-radius: 20px;
        background: #fafdff;
        color: inherit;
        cursor: pointer;
        font: inherit;
        transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
      }

      .choice:hover {
        transform: translateY(-4px);
        border-color: #6da8d7;
        background: #eaf5ff;
      }

      .choice:focus-visible,
      .reset:focus-visible {
        outline: 3px solid #287fc0;
        outline-offset: 3px;
      }

      .emoji {
        display: block;
        margin-bottom: 5px;
        font-size: 2.5rem;
        line-height: 1;
      }

      .result {
        min-height: 104px;
        margin-top: 24px;
        padding: 18px;
        border-radius: 18px;
        background: #eaf4fc;
      }

      .result h2 {
        margin: 0 0 6px;
        font-size: 1.5rem;
      }

      .result p {
        margin: 0;
        color: #587894;
      }

      .result[data-outcome="win"] h2 {
        color: #246da8;
      }

      .result[data-outcome="lose"] h2 {
        color: #246da8;
      }

      .reset {
        margin-top: 18px;
        padding: 10px 18px;
        border: 0;
        border-radius: 999px;
        background: #d7eafb;
        color: #24577f;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .reset:hover {
        background: #c4e0f6;
      }

      @media (max-width: 420px) {
        .score {
          min-width: 0;
          flex: 1;
        }

        .choice {
          min-height: 96px;
          border-radius: 16px;
          font-size: 0.9rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <p class="eyebrow">ROCK · PAPER · SCISSORS</p>
      <h1>じゃんけん</h1>
      <p class="intro">手を選んで、コンピューターと勝負しよう！</p>

      <section class="scoreboard" aria-label="スコア">
        <div class="score">
          <span>あなた</span>
          <strong id="player-score">0</strong>
        </div>
        <div class="score">
          <span>コンピューター</span>
          <strong id="computer-score">0</strong>
        </div>
      </section>

      <p class="prompt">どの手を出す？</p>
      <div class="choices" aria-label="手を選ぶ">
        <button class="choice" type="button" data-choice="rock" aria-label="グー">
          <span class="emoji" aria-hidden="true">✊</span>グー
        </button>
        <button class="choice" type="button" data-choice="paper" aria-label="パー">
          <span class="emoji" aria-hidden="true">✋</span>パー
        </button>
        <button class="choice" type="button" data-choice="scissors" aria-label="チョキ">
          <span class="emoji" aria-hidden="true">✌️</span>チョキ
        </button>
      </div>

      <section class="result" id="result" aria-live="polite" aria-atomic="true">
        <h2 id="result-title">さあ、勝負！</h2>
        <p id="result-detail">グー・パー・チョキから選んでね。</p>
      </section>
      <button class="reset" id="reset" type="button">スコアをリセット</button>
    </main>

    <script>
      const hands = {
        rock: { name: "グー", emoji: "✊" },
        paper: { name: "パー", emoji: "✋" },
        scissors: { name: "チョキ", emoji: "✌️" }
      };
      const choices = Object.keys(hands);
      const winningPairs = {
        rock: "scissors",
        paper: "rock",
        scissors: "paper"
      };

      let playerScore = 0;
      let computerScore = 0;

      const playerScoreElement = document.querySelector("#player-score");
      const computerScoreElement = document.querySelector("#computer-score");
      const resultElement = document.querySelector("#result");
      const resultTitle = document.querySelector("#result-title");
      const resultDetail = document.querySelector("#result-detail");

      function play(playerChoice) {
        const computerChoice = choices[Math.floor(Math.random() * choices.length)];
        let outcome;

        if (playerChoice === computerChoice) {
          outcome = "draw";
        } else if (winningPairs[playerChoice] === computerChoice) {
          outcome = "win";
          playerScore += 1;
        } else {
          outcome = "lose";
          computerScore += 1;
        }

        playerScoreElement.textContent = playerScore;
        computerScoreElement.textContent = computerScore;
        resultElement.dataset.outcome = outcome;
        resultTitle.textContent = outcome === "draw" ? "あいこ！" : outcome === "win" ? "あなたの勝ち！" : "あなたの負け…";
        resultDetail.textContent =
          `あなた ${hands[playerChoice].emoji}${hands[playerChoice].name} ／ ` +
          `コンピューター ${hands[computerChoice].emoji}${hands[computerChoice].name}`;
      }

      document.querySelectorAll(".choice").forEach((button) => {
        button.addEventListener("click", () => play(button.dataset.choice));
      });

      document.querySelector("#reset").addEventListener("click", () => {
        playerScore = 0;
        computerScore = 0;
        playerScoreElement.textContent = playerScore;
        computerScoreElement.textContent = computerScore;
        resultElement.dataset.outcome = "";
        resultTitle.textContent = "さあ、勝負！";
        resultDetail.textContent = "グー・パー・チョキから選んでね。";
      });
    </script>
  </body>
</html>
