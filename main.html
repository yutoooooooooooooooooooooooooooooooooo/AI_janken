<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dceeff">
    <title>じゃんけんゲーム</title>
    <style>
      :root {
        color-scheme: light;
        --bg-start: #071a2d;
        --bg-mid: #0d2f4f;
        --bg-end: #0b5c88;
        --panel: rgba(255, 255, 255, 0.18);
        --panel-solid: rgba(247, 252, 255, 0.92);
        --card: rgba(255, 255, 255, 0.72);
        --line: rgba(137, 188, 232, 0.7);
        --text: #123a5d;
        --muted: #5e7c96;
        --primary: #1c7ed6;
        --primary-strong: #114f92;
        --success: #1d9d6c;
        --warning: #a76d14;
        --danger: #c93d34;
        --shadow: rgba(7, 31, 51, 0.2);
        font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.25), transparent 18%),
          radial-gradient(circle at 80% 30%, rgba(123, 210, 255, 0.22), transparent 22%),
          linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 38%, var(--bg-end) 100%);
      }

      .game,
      .game-menu {
        position: relative;
        width: min(100%, 620px);
        padding: clamp(24px, 6vw, 52px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 32px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 28px 80px rgba(3, 19, 34, 0.35);
        text-align: center;
        overflow: hidden;
      }

      .game::before,
      .game::after,
      .game-menu::before,
      .game-menu::after {
        content: "";
        position: absolute;
        inset: auto;
        border-radius: 50%;
        filter: blur(18px);
        opacity: 0.65;
        pointer-events: none;
      }

      .game::before {
        width: 180px;
        height: 180px;
        right: -30px;
        top: -45px;
        background: rgba(115, 203, 255, 0.35);
      }

      .game::after {
        width: 120px;
        height: 120px;
        left: -28px;
        bottom: -26px;
        background: rgba(255, 196, 116, 0.25);
      }

      .game-menu::before {
        width: 180px;
        height: 180px;
        right: -30px;
        top: -45px;
        background: rgba(115, 203, 255, 0.35);
      }

      .game-menu::after {
        width: 120px;
        height: 120px;
        left: -28px;
        bottom: -26px;
        background: rgba(255, 196, 116, 0.25);
      }

      .game-option {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        width: 100%;
        gap: 18px;
        margin-top: 30px;
        padding: 20px;
        border: 1px solid rgba(153, 200, 243, 0.7);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(231, 239, 250, 0.9));
        color: var(--text);
        cursor: pointer;
        font: inherit;
        text-align: left;
        box-shadow: 0 12px 24px rgba(15, 56, 86, 0.1);
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      }

      .game-option:hover {
        transform: translateY(-3px);
        border-color: rgba(71, 154, 221, 0.95);
        box-shadow: 0 18px 30px rgba(15, 56, 86, 0.16);
      }

      .game-option:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }

      .game-option-icon {
        flex: 0 0 auto;
        font-size: 2rem;
      }

      .game-option-copy {
        flex: 1;
      }

      .game-option-copy strong,
      .game-option-copy small {
        display: block;
      }

      .game-option-copy strong {
        font-size: 1.25rem;
      }

      .game-option-copy small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .game-option-arrow {
        color: var(--primary);
        font-size: 2rem;
        font-weight: 700;
      }

      .eyebrow {
        position: relative;
        z-index: 1;
        margin: 0 0 10px;
        color: rgba(191, 228, 255, 0.92);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 3.5rem);
        letter-spacing: 0.08em;
        color: #ffffff;
        text-shadow: 0 10px 30px rgba(13, 71, 120, 0.3);
      }

      .intro {
        position: relative;
        z-index: 1;
        margin: 12px 0 28px;
        color: rgba(228, 242, 255, 0.9);
        font-weight: 600;
      }

      .scoreboard {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 14px;
      }

      .score {
        flex: 1;
        max-width: 180px;
        padding: 18px 14px 16px;
        border: 1px solid rgba(151, 199, 239, 0.75);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .score span {
        display: block;
        color: rgba(221, 238, 255, 0.85);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .score strong {
        display: block;
        margin-top: 8px;
        font-size: clamp(2rem, 6vw, 2.6rem);
        color: #ffffff;
        line-height: 1;
      }

      .reset {
        position: relative;
        z-index: 1;
        display: block;
        margin: 0 auto 22px;
        padding: 10px 18px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #eef8ff, #d8effd);
        color: var(--primary-strong);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(18, 103, 166, 0.18);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .reset:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(18, 103, 166, 0.2);
      }

      .result {
        position: relative;
        z-index: 1;
        min-height: 112px;
        margin-top: 16px;
        padding: 18px 16px 20px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(233, 246, 255, 0.95), rgba(205, 230, 251, 0.9));
        border: 1px solid rgba(120, 183, 245, 0.5);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .result h2 {
        margin: 0 0 8px;
        font-size: clamp(1.4rem, 4vw, 1.8rem);
        color: var(--primary-strong);
      }

      .result p {
        margin: 0;
        color: var(--muted);
        font-weight: 600;
      }

      .result[data-outcome="lose"] {
        background: linear-gradient(180deg, rgba(255, 240, 239, 0.97), rgba(255, 231, 230, 0.9));
        border-color: rgba(216, 117, 108, 0.5);
      }

      .result[data-outcome="lose"] h2 {
        color: var(--danger);
      }

      .result[data-outcome="draw"] {
        background: linear-gradient(180deg, rgba(255, 248, 223, 0.97), rgba(255, 237, 188, 0.9));
        border-color: rgba(209, 160, 69, 0.45);
      }

      .result[data-outcome="draw"] h2 {
        color: var(--warning);
      }

      .result[data-outcome="win"] {
        background: linear-gradient(180deg, rgba(234, 250, 240, 0.98), rgba(206, 240, 219, 0.9));
        border-color: rgba(75, 179, 121, 0.45);
      }

      .result[data-outcome="win"] h2 {
        color: var(--success);
      }

      .reveal {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
        padding: 18px 12px 10px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.1);
      }

      .reveal[hidden] {
        display: none;
      }

      .played {
        padding: 16px 12px 12px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(231, 242, 255, 0.96), rgba(209, 228, 248, 0.9));
        border: 1px solid rgba(125, 174, 219, 0.75);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .played.ai {
        background: linear-gradient(180deg, rgba(255, 247, 232, 0.96), rgba(252, 230, 191, 0.9));
        border-color: rgba(210, 159, 81, 0.7);
      }

      .reveal[data-phase="counting"] .played {
        animation: fist-pump 600ms ease-in-out infinite;
      }

      .reveal[data-phase="throw"] .played {
        animation: hands-meet 350ms ease-out both;
      }

      .reveal[data-phase="throw"] .played .emoji {
        animation: hand-reveal 350ms ease-out both;
      }

      .reveal[data-phase="throw"] .played.ai {
        animation-name: hands-meet-ai;
      }

      @keyframes fist-pump {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes hands-meet {
        from { transform: translateX(0) scale(1); }
        to { transform: translateX(8px) scale(1.05); }
      }

      @keyframes hands-meet-ai {
        from { transform: translateX(0) scale(1); }
        to { transform: translateX(-8px) scale(1.05); }
      }

      @keyframes hand-reveal {
        from { transform: scale(0.75) rotate(-12deg); }
        to { transform: scale(1.15) rotate(0); }
      }

      .played span {
        display: block;
        color: #5b82aa;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .played.ai span {
        color: #a16b1f;
      }

      .played .emoji {
        display: block;
        margin: 10px 0 8px;
        font-size: clamp(2.5rem, 8vw, 3.2rem);
        line-height: 1;
      }

      .played strong {
        display: block;
        font-size: 1.08rem;
        color: var(--text);
      }

      .versus {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .prompt {
        position: relative;
        z-index: 1;
        margin: 26px 0 16px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: rgba(231, 240, 255, 0.9);
      }

      .choices {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .choice {
        min-height: 120px;
        border: 1px solid rgba(153, 200, 243, 0.7);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(231, 239, 250, 0.9));
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.04em;
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
        box-shadow: 0 12px 24px rgba(15, 56, 86, 0.1);
      }

      .choice:hover {
        transform: translateY(-3px);
        border-color: rgba(71, 154, 221, 0.95);
        box-shadow: 0 18px 30px rgba(15, 56, 86, 0.12);
      }

      .choice:active {
        transform: translateY(0);
      }

      .choice:disabled {
        cursor: wait;
      }

      .choice:focus-visible,
      .reset:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }

      .emoji {
        display: block;
        margin-bottom: 7px;
        font-size: 2.7rem;
        line-height: 1;
      }

      .baseball-topbar {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .baseball-topbar .reset {
        margin: 0;
        padding: 9px 14px;
        font-size: 0.9rem;
      }

      .baseball-scoreboard {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 20px 0;
      }

      .baseball-score {
        min-width: 100px;
        padding: 12px 20px;
        border: 1px solid rgba(151, 199, 239, 0.75);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }

      .baseball-score span,
      .baseball-score strong {
        display: block;
      }

      .baseball-score span {
        font-size: 0.8rem;
      }

      .baseball-score strong {
        margin-top: 4px;
        font-size: 1.8rem;
        line-height: 1;
      }

      .baseball-scene {
        position: relative;
        z-index: 1;
        height: 330px;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.72);
        border-radius: 26px;
        background:
          radial-gradient(ellipse at 50% 50%, rgba(245, 215, 149, 0.96) 0 13%, transparent 13.5%),
          linear-gradient(180deg, #7dca87 0%, #4da768 56%, #388c59 100%);
        box-shadow: inset 0 0 32px rgba(13, 69, 42, 0.25), 0 12px 26px rgba(7, 31, 51, 0.18);
      }

      .baseball-scene::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 150px;
        height: 150px;
        border: 2px solid rgba(255, 255, 255, 0.55);
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .baseball-scene::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%);
      }

      .baseball-player {
        position: absolute;
        z-index: 1;
        left: 50%;
        display: grid;
        justify-items: center;
        gap: 2px;
        color: #fff;
        font-weight: 800;
        text-shadow: 0 2px 5px rgba(9, 48, 29, 0.6);
        transform: translateX(-50%);
      }

      .baseball-player span {
        font-size: 2.5rem;
        line-height: 1;
      }

      .baseball-pitcher {
        top: 35%;
      }

      .baseball-batter {
        bottom: 12px;
      }

      .baseball-scene.pitching .baseball-pitcher {
        animation: pitcher-throw 560ms ease-in-out both;
        transform-origin: 50% 80%;
      }

      .baseball-scene.swinging .baseball-batter span {
        animation: batter-swing 420ms ease-in-out;
        transform-origin: 50% 80%;
      }

      .pitch-ball {
        position: absolute;
        z-index: 2;
        top: 52%;
        left: 50%;
        width: 25px;
        height: 25px;
        border: 2px solid #d8443d;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 3px 8px rgba(16, 49, 31, 0.35);
        opacity: 0;
        transform: translate(-50%, -50%);
      }

      .pitch-ball::before,
      .pitch-ball::after {
        content: "";
        position: absolute;
        top: 3px;
        width: 5px;
        height: 15px;
        border: 1px solid #d8443d;
        border-top-color: transparent;
        border-bottom-color: transparent;
        border-radius: 50%;
      }

      .pitch-ball::before {
        left: 4px;
      }

      .pitch-ball::after {
        right: 4px;
      }

      .baseball-scene.pitching .pitch-ball {
        animation: ball-flight 1400ms linear forwards;
      }

      @keyframes pitcher-throw {
        0%, 100% { transform: translateX(-50%) rotate(0); }
        25% { transform: translateX(-50%) rotate(-12deg) translateY(-4px); }
        55% { transform: translateX(-50%) rotate(16deg) translateY(2px); }
      }

      @keyframes batter-swing {
        0% { transform: rotate(0); }
        45% { transform: rotate(-35deg) scale(1.1); }
        100% { transform: rotate(45deg); }
      }

      @keyframes ball-flight {
        0% { top: 52%; opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
        100% { top: 77%; opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
      }

      .baseball-result {
        position: relative;
        z-index: 1;
        min-height: 84px;
        margin: 16px 0;
        padding: 16px;
        border: 1px solid rgba(120, 183, 245, 0.5);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(233, 246, 255, 0.95), rgba(205, 230, 251, 0.9));
        color: var(--primary-strong);
        font-size: 1.25rem;
        font-weight: 800;
      }

      .swing-button {
        position: relative;
        z-index: 1;
        width: 100%;
        min-height: 64px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 20px;
        background: linear-gradient(180deg, #ffe082, #ffb52e);
        color: #583300;
        cursor: pointer;
        font: inherit;
        font-size: 1.2rem;
        font-weight: 900;
        box-shadow: 0 10px 24px rgba(77, 51, 5, 0.2);
      }

      .swing-button:hover:not(:disabled) {
        filter: brightness(1.05);
        transform: translateY(-2px);
      }

      .swing-button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .swing-button:focus-visible,
      .baseball-topbar .reset:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }

      @media (max-width: 420px) {
        .game {
          padding: 22px 16px 20px;
        }

        .scoreboard {
          gap: 10px;
        }

        .score {
          min-width: 0;
          flex: 1;
          padding: 14px 10px 12px;
        }

        .choice {
          min-height: 96px;
          border-radius: 16px;
          font-size: 0.9rem;
        }

        .reveal {
          gap: 10px;
          padding: 14px 8px 8px;
        }

        .baseball-scene {
          height: 300px;
        }

        .baseball-score {
          min-width: 0;
          flex: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="game-menu" id="game-menu">
      <p class="eyebrow">CHOOSE A GAME</p>
      <h1>ゲームを選ぼう</h1>
      <p class="intro">遊びたいゲームを選択してください。</p>
      <button class="game-option" id="start-janken" type="button">
        <span class="game-option-icon" aria-hidden="true">✊✌️✋</span>
        <span class="game-option-copy">
          <strong>じゃんけん</strong>
          <small>AIとじゃんけん勝負！</small>
        </span>
        <span class="game-option-arrow" aria-hidden="true">›</span>
      </button>
      <button class="game-option" id="start-baseball" type="button">
        <span class="game-option-icon" aria-hidden="true">⚾</span>
        <span class="game-option-copy">
          <strong>野球ゲーム</strong>
          <small>ボールに合わせてスイング！</small>
        </span>
        <span class="game-option-arrow" aria-hidden="true">›</span>
      </button>
    </main>

    <main class="game" id="game-screen" hidden>
      <p class="eyebrow">ROCK · PAPER · SCISSORS</p>
      <h1>じゃんけん</h1>
      <p class="intro">手を選んで、AIと勝負しよう！</p>

      <section class="scoreboard" aria-label="スコア">
        <div class="score">
          <span>あなた</span>
          <strong id="player-score">0</strong>
        </div>
        <div class="score">
          <span>AI</span>
          <strong id="computer-score">0</strong>
        </div>
      </section>
      <button class="reset" id="reset" type="button">スコアをリセット</button>

      <section class="result" id="result" aria-live="polite" aria-atomic="true">
        <h2 id="result-title">さあ、勝負！</h2>
        <p id="result-detail">グー・パー・チョキから選んでね。</p>
      </section>

      <section class="reveal" id="reveal" hidden aria-label="出した手">
        <div class="played">
          <span>あなた</span>
          <span class="emoji" id="player-hand-emoji" aria-hidden="true">✊</span>
          <strong id="player-hand-name">グー</strong>
        </div>
        <p class="versus">VS</p>
        <div class="played ai">
          <span>AIの手</span>
          <span class="emoji" id="ai-hand-emoji" aria-hidden="true">✋</span>
          <strong id="ai-hand-name">パー</strong>
        </div>
      </section>

      <p class="prompt">どの手を出す？</p>
      <div class="choices" aria-label="手を選ぶ">
        <button class="choice" type="button" data-choice="rock" aria-label="グー">
          <span class="emoji" aria-hidden="true">✊</span>グー
        </button>
        <button class="choice" type="button" data-choice="scissors" aria-label="チョキ">
          <span class="emoji" aria-hidden="true">✌️</span>チョキ
        </button>
        <button class="choice" type="button" data-choice="paper" aria-label="パー">
          <span class="emoji" aria-hidden="true">✋</span>パー
        </button>
      </div>
    </main>

    <main class="game" id="baseball-screen" hidden>
      <div class="baseball-topbar">
        <button class="reset" id="back-to-menu" type="button">ゲーム選択へ</button>
        <button class="reset" id="reset-baseball" type="button">リスタート</button>
      </div>
      <p class="eyebrow">BASEBALL TIMING GAME</p>
      <h1>野球ゲーム</h1>
      <p class="intro">ボールがホームに来た瞬間にスイング！</p>

      <section class="baseball-scoreboard" aria-label="試合スコア">
        <div class="baseball-score">
          <span>ヒット</span>
          <strong id="baseball-hits">0</strong>
        </div>
        <div class="baseball-score">
          <span>アウト</span>
          <strong id="baseball-outs">0 / 3</strong>
        </div>
      </section>

      <section class="baseball-scene" id="baseball-scene" aria-label="野球場">
        <div class="baseball-player baseball-pitcher">
          <span aria-hidden="true">🤾‍♂️</span>
          <strong>ピッチャー</strong>
        </div>
        <div class="pitch-ball" aria-hidden="true"></div>
        <div class="baseball-player baseball-batter">
          <span aria-hidden="true">🏏</span>
          <strong>バッター</strong>
        </div>
      </section>

      <p class="baseball-result" id="baseball-result" aria-live="polite" aria-atomic="true">投球を待とう！</p>
      <button class="swing-button" id="swing-button" type="button" disabled>タイミングよくスイング！</button>
    </main>

    <script>
      const hands = {
        rock: { name: "グー", emoji: "✊" },
        paper: { name: "パー", emoji: "✋" },
        scissors: { name: "チョキ", emoji: "✌️" }
      };
      const choices = Object.keys(hands);
      const winningPairs = {
        rock: "scissors",
        paper: "rock",
        scissors: "paper"
      };

      let playerScore = 0;
      let computerScore = 0;
      let roundTimer = null;

      const playerScoreElement = document.querySelector("#player-score");
      const computerScoreElement = document.querySelector("#computer-score");
      const resultElement = document.querySelector("#result");
      const resultTitle = document.querySelector("#result-title");
      const resultDetail = document.querySelector("#result-detail");
      const revealElement = document.querySelector("#reveal");
      const playerHandEmoji = document.querySelector("#player-hand-emoji");
      const playerHandName = document.querySelector("#player-hand-name");
      const aiHandEmoji = document.querySelector("#ai-hand-emoji");
      const aiHandName = document.querySelector("#ai-hand-name");
      const choiceButtons = document.querySelectorAll(".choice");
      const gameMenu = document.querySelector("#game-menu");
      const gameScreen = document.querySelector("#game-screen");
      const baseballScreen = document.querySelector("#baseball-screen");
      const baseballScene = document.querySelector("#baseball-scene");
      const baseballHitsElement = document.querySelector("#baseball-hits");
      const baseballOutsElement = document.querySelector("#baseball-outs");
      const baseballResultElement = document.querySelector("#baseball-result");
      const swingButton = document.querySelector("#swing-button");
      let baseballHits = 0;
      let baseballOuts = 0;
      let baseballActive = false;
      let pitchStartedAt = null;
      let nextPitchTimer = null;
      let pitchTimeout = null;
      let swingAnimationTimer = null;

      document.querySelector("#start-janken").addEventListener("click", () => {
        gameMenu.hidden = true;
        gameScreen.hidden = false;
        choiceButtons[0].focus();
      });

      function stopBaseballTimers() {
        window.clearTimeout(nextPitchTimer);
        window.clearTimeout(pitchTimeout);
        window.clearTimeout(swingAnimationTimer);
        nextPitchTimer = null;
        pitchTimeout = null;
        swingAnimationTimer = null;
        pitchStartedAt = null;
        baseballScene.classList.remove("pitching");
        baseballScene.classList.remove("swinging");
        swingButton.disabled = true;
      }

      function updateBaseballScore() {
        baseballHitsElement.textContent = baseballHits;
        baseballOutsElement.textContent = `${baseballOuts} / 3`;
      }

      function schedulePitch(delay) {
        if (!baseballActive) {
          return;
        }

        nextPitchTimer = window.setTimeout(() => {
          pitchStartedAt = performance.now();
          baseballScene.classList.add("pitching");
          swingButton.disabled = false;
          baseballResultElement.textContent = "ボールが来る！タイミングを合わせて！";
          pitchTimeout = window.setTimeout(() => resolvePitch("miss"), 1400);
        }, delay);
      }

      function resolvePitch(result) {
        if (!baseballActive || pitchStartedAt === null) {
          return;
        }

        window.clearTimeout(pitchTimeout);
        pitchTimeout = null;
        pitchStartedAt = null;
        baseballScene.classList.remove("pitching");
        swingButton.disabled = true;

        if (result === "home-run") {
          baseballHits += 3;
          baseballResultElement.textContent = "ホームラン！ジャストミート！ +3";
        } else if (result === "hit") {
          baseballHits += 1;
          baseballResultElement.textContent = "ヒット！ナイススイング！ +1";
        } else {
          baseballOuts += 1;
          baseballResultElement.textContent = result === "miss" ? "見逃し！アウト…" : "空振り…アウト！";
        }

        updateBaseballScore();
        if (baseballOuts >= 3) {
          baseballActive = false;
          baseballResultElement.textContent = `ゲーム終了！ヒット ${baseballHits} 点`;
          swingButton.textContent = "リスタートしてもう一度！";
          swingButton.disabled = false;
          return;
        }

        schedulePitch(900);
      }

      function startBaseball() {
        stopBaseballTimers();
        baseballHits = 0;
        baseballOuts = 0;
        baseballActive = true;
        swingButton.textContent = "タイミングよくスイング！";
        baseballResultElement.textContent = "ピッチャーが投球準備中…";
        updateBaseballScore();
        gameMenu.hidden = true;
        baseballScreen.hidden = false;
        schedulePitch(700);
        swingButton.focus();
      }

      document.querySelector("#start-baseball").addEventListener("click", startBaseball);
      document.querySelector("#reset-baseball").addEventListener("click", startBaseball);
      swingButton.addEventListener("click", () => {
        if (!baseballActive) {
          startBaseball();
          return;
        }

        if (pitchStartedAt === null) {
          return;
        }

        baseballScene.classList.remove("swinging");
        void baseballScene.offsetWidth;
        baseballScene.classList.add("swinging");
        window.clearTimeout(swingAnimationTimer);
        swingAnimationTimer = window.setTimeout(() => {
          baseballScene.classList.remove("swinging");
          swingAnimationTimer = null;
        }, 450);

        const timing = Math.abs(performance.now() - pitchStartedAt - 1050);
        resolvePitch(timing <= 260 ? "home-run" : timing <= 600 ? "hit" : "out");
      });

      document.querySelector("#back-to-menu").addEventListener("click", () => {
        baseballActive = false;
        stopBaseballTimers();
        baseballScreen.hidden = true;
        gameMenu.hidden = false;
        document.querySelector("#start-baseball").focus();
      });

      function play(playerChoice) {
        const computerChoice = choices[Math.floor(Math.random() * choices.length)];
        choiceButtons.forEach((button) => {
          button.disabled = true;
        });

        revealElement.hidden = false;
        revealElement.dataset.phase = "counting";
        playerHandEmoji.textContent = hands.rock.emoji;
        playerHandName.textContent = hands.rock.name;
        aiHandEmoji.textContent = hands.rock.emoji;
        aiHandName.textContent = hands.rock.name;
        resultElement.dataset.outcome = "";
        resultTitle.textContent = "初はグー！";
        resultDetail.textContent = "AIといっしょに手を振って…";

        roundTimer = window.setTimeout(() => {
          resultTitle.textContent = "じゃんけん…";
          roundTimer = window.setTimeout(() => {
            revealElement.dataset.phase = "throw";
            resultTitle.textContent = "ぽん！";
            roundTimer = window.setTimeout(() => {
              const outcome = playerChoice === computerChoice
                ? "draw"
                : winningPairs[playerChoice] === computerChoice
                  ? "win"
                  : "lose";

              if (outcome === "win") {
                playerScore += 1;
              } else if (outcome === "lose") {
                computerScore += 1;
              }

              const playerHand = hands[playerChoice];
              const aiHand = hands[computerChoice];

              playerScoreElement.textContent = playerScore;
              computerScoreElement.textContent = computerScore;
              playerHandEmoji.textContent = playerHand.emoji;
              playerHandName.textContent = playerHand.name;
              aiHandEmoji.textContent = aiHand.emoji;
              aiHandName.textContent = aiHand.name;
              revealElement.dataset.phase = "result";
              resultElement.dataset.outcome = outcome;
              resultTitle.textContent = outcome === "draw" ? "あいこ！" : outcome === "win" ? "あなたの勝ち！" : "あなたの負け…";
              resultDetail.textContent = "もう一度手を選んでね。";
              choiceButtons.forEach((button) => {
                button.disabled = false;
              });
              roundTimer = null;
            }, 350);
          }, 600);
        }, 600);
      }

      choiceButtons.forEach((button) => {
        button.addEventListener("click", () => play(button.dataset.choice));
      });

      document.querySelector("#reset").addEventListener("click", () => {
        window.clearTimeout(roundTimer);
        roundTimer = null;
        playerScore = 0;
        computerScore = 0;
        playerScoreElement.textContent = playerScore;
        computerScoreElement.textContent = computerScore;
        revealElement.hidden = true;
        delete revealElement.dataset.phase;
        resultElement.dataset.outcome = "";
        resultTitle.textContent = "さあ、勝負！";
        resultDetail.textContent = "グー・パー・チョキから選んでね。";
        choiceButtons.forEach((button) => {
          button.disabled = false;
        });
      });
    </script>
  </body>
</html>
